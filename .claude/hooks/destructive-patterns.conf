# Destructive-operation patterns for guard-destructive-ops.sh (PreToolUse on Bash).
#
# Format:  one rule per line  ->  TIER<TAB>extended-regex<TAB>human reason
#   TIER is always DENY today (gray-zone = hard-deny per project decision).
#   The regex is matched case-insensitively against the Bash command string.
#
# LIMITATIONS (read before trusting this):
#   - The hook only sees the literal command string. SQL hidden in a file
#     (`psql -f x.sql`), piped/encoded commands, or destructive calls made via
#     non-Bash tools are NOT inspected. This stops honest mistakes, not an
#     adversary.
#   - DELETE/UPDATE-without-WHERE, force-push-to-main and `git restore` without
#     --staged are handled in the script (they need context the regex can't
#     express — grep -E has no lookahead). Don't add them here.
#
# To tune: add/remove/comment lines. No shell edits needed. Lines starting with
# '#' and blank lines are ignored. Use a literal TAB between the 3 fields.

# --- SQL: catastrophic schema / data loss --------------------------------
DENY	\bDROP\s+DATABASE\b	DROP DATABASE destroys an entire database
DENY	\bDROP\s+SCHEMA\b	DROP SCHEMA destroys a schema and its objects
DENY	\bDROP\s+TABLE\b	DROP TABLE destroys a table (run it inside a reviewed migration instead)
DENY	\bTRUNCATE\b	TRUNCATE empties a table irreversibly (migrations apply via supabase db push / psql -f, not inline)
DENY	\bsupabase\s+db\s+reset\b	supabase db reset wipes the local database

# --- Filesystem: recursive force delete of dangerous roots ----------------
DENY	\brm\s+-[a-z]*r[a-z]*f|\brm\s+-[a-z]*f[a-z]*r	rm -rf is a recursive force delete — verify the target manually
DENY	\b(:\(\)\s*\{|fork\s*bomb)	possible fork bomb

# --- Git: history / branch destruction ------------------------------------
DENY	\bgit\s+reset\s+--hard\b	git reset --hard discards uncommitted work
DENY	\bgit\s+checkout\s+--\s	git checkout -- <path> discards uncommitted changes in the working tree (same loss as reset --hard, narrower blast radius)
DENY	\bgit\s+checkout\s+\.(\s|$)	git checkout . discards every uncommitted change in the tree
DENY	\bgit\s+clean\s+-[a-z]*f	git clean -f deletes untracked files
DENY	\bgit\s+branch\s+-D\s+(main|master|develop)\b	deleting a protected branch
DENY	\bgit\s+push\s+.*--delete\s+(origin\s+)?(main|master)\b	deleting a remote protected branch

# --- Secret exfiltration: sending credentials to the network --------------
DENY	(curl|wget|nc|ncat|scp|rsync).*(\.env|id_rsa|id_ed25519|\.pem|\.p12|service[-_]account|credentials\.json|secrets?\.(json|ya?ml))	possible secret exfiltration over the network
