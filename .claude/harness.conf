# The harness's entire per-project configuration surface.
#
# Sourced by .claude/hooks/lib.sh (so every hook that sources lib.sh sees it) and
# by guard-protected-paths.sh, and read by the `cook` and `debug` skills before
# they measure. The hooks hold the mechanism; the values that make it YOUR repo's
# live here. Answer sections 1–4 and the harness is adopted.
#
# Shell syntax: sourced by bash. Keep it to assignments.

# ---------------------------------------------------------------------------
# 1. GATES — what "it works" means here, in the order they run.
# ---------------------------------------------------------------------------
# Make targets, fail-fastest first. Each recipe's LAST line must be
#
#     @scripts/gate-record.sh <target>
#
# make stops at the first failing line, so reaching that line IS the pass; the
# record is keyed to a fingerprint of the tree it ran on, and lapses on the next
# edit. No hook enforces it — `cook` §6 and `debug` §9 run the gates themselves.
#
# Gate 1 in `cook` §6 is always `git diff --name-only` (did the attempt edit its
# own grading criteria?) and is not listed here.
#
# These are the only thing in the harness that actually stops bad work. A gate
# that does not fail on real breakage is not a gate.
GATES="lint test"

# ---------------------------------------------------------------------------
# 2. CONTRACT-BEARING PATHS — where a change can break a documented contract.
# ---------------------------------------------------------------------------
# hooks/check-doc-sync.sh: a change here with no doc change blocks Stop.
# Everything NOT matched is behaviour-preserving as far as the docs are concerned.
# Extended regex over repo-relative paths.
#
# Rule of thumb: response shapes, schemas, migrations, the route table, the
# design-token layer, shared UI primitives. Not services, not tests.
# Unset, the hook matches nothing and stays inert (fail-open by design).
DOC_SYNC_CONTRACT_PATHS='(NOTHING_CONFIGURED_YET)'

# What counts as "a doc moved with it". docs/backlogs/** never does — goal logs
# and notes are working files, not the contract record.
DOC_SYNC_DOC_PATHS='(^CLAUDE\.md$|^docs/.*\.md$|openapi\.json$|schema\.json$)'

# ---------------------------------------------------------------------------
# 3. GENERATED FILES — never hand-edited.
# ---------------------------------------------------------------------------
# hooks/guard-protected-paths.sh denies Edit/Write on these, before the edit
# rather than after. Space-separated, repo-relative. The Doc map in CLAUDE.md
# names the command that regenerates each.
GENERATED_FILES=""

# ---------------------------------------------------------------------------
# 4. GAP AUDIT — when a session is big enough to warrant the wiring audit.
# ---------------------------------------------------------------------------
# hooks/check-gap-audit.sh. Tune the threshold from the block lines in
# .claude/state/harness.log.
GAP_AUDIT_EXTENSIONS='\.(py|ts|tsx|js|jsx|go|rs|java|kt|swift|sql)$'
GAP_AUDIT_THRESHOLD=5

# ---------------------------------------------------------------------------
# Optional
# ---------------------------------------------------------------------------
# Skill for the browser pass in `cook` §8 and `debug` §9. Empty = no browser
# pass (backend-only or CLI projects).
BROWSER_VERIFY_SKILL=""
