# The harness's entire per-project configuration surface.
#
# Sourced by the hooks at runtime and read by the `cook` skill before it
# measures. Answer the three questions below and the harness is adopted; nothing
# else in .claude/ needs editing to work in a new repo.
#
# Shell syntax: sourced by bash. Keep it to assignments.

# ---------------------------------------------------------------------------
# 1. GATES — what "it works" means here, in the order they run.
# ---------------------------------------------------------------------------
# `cook` §6 runs these in order and stops at the first failure. They are the
# only thing in the harness that actually stops bad work; everything else is
# prose. A gate that does not fail on real breakage is not a gate.
#
# Gate 0 is always `git diff --name-only` (did the attempt edit its own grading
# criteria?) and is hardcoded in the skill — do not list it here.
GATES=(
  "make lint"
  "make test"
)

# A one-line description of each gate, same order, shown in the handoff so a
# cold implementer knows what it must keep passing.
GATE_DESCRIPTIONS=(
  "linters, type checks, generated-artifact staleness, frontend build"
  "the test suite"
)

# ---------------------------------------------------------------------------
# 2. CONTRACT-BEARING PATHS — where a change can break a documented contract.
# ---------------------------------------------------------------------------
# Used by hooks/check-doc-sync.sh. A change here with no doc change blocks Stop.
# Everything NOT matched is treated as behaviour-preserving and owes no doc.
# Extended regex, matched against `git status --porcelain` output.
#
# Rule of thumb: response shapes, schemas, migrations, route tables, the design
# token layer, shared UI primitives. Not services, not tests, not components.
DOC_SYNC_CONTRACT_PATHS='(NOTHING_CONFIGURED_YET)'

# Paths that count as "a doc moved with it" and satisfy the hook.
DOC_SYNC_DOC_PATHS='(^.{2,3}(docs/.*\.md|.*plan\.md|CLAUDE\.md|.*openapi\.json)$)'

# ---------------------------------------------------------------------------
# 3. GAP AUDIT — when a session is big enough to warrant the wiring audit.
# ---------------------------------------------------------------------------
# Used by hooks/check-gap-audit.sh. Source-file extensions for this stack, and
# how many changed files count as "real implementation".
GAP_AUDIT_EXTENSIONS='\.(go|ts|tsx|js|jsx|py|rs|java|kt|swift)$'
GAP_AUDIT_THRESHOLD=5

# ---------------------------------------------------------------------------
# Optional
# ---------------------------------------------------------------------------
# Skill to invoke for the browser pass in `cook` §8. Empty = no browser pass
# (backend-only or CLI projects). Set to e.g. "verify" if you have one.
BROWSER_VERIFY_SKILL=""
